<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A15">
<!-- title, description, Open Graph e JSON-LD sao gerados pelo script a partir do CONFIG -->
<title></title>
<style>
/* =========================================================================
   VARIAVEIS DE FALLBACK
   O tema real e injetado no :root pelo JavaScript (aplicarTema).
   Estes valores so existem para a pagina nao piscar sem cor no primeiro frame.
   ========================================================================= */
:root{
  --fundo:#0E1A15; --fundoAlt:#152A21; --acento:#C87941; --acentoEscuro:#A05F31;
  --claro:#F2F0EA; --texto:#F2F0EA; --textoSuave:#9DAB9F; --contraste:#0E1A15;
  --zap:#25D366; --raio:4px;
  --fonteTitulo:Georgia, serif; --fonteTexto:system-ui, sans-serif;
  --overlay:rgba(14,26,21,.72);       /* overlay sobre fotos, definido por tomImagem */
  --overlaySuave:rgba(14,26,21,.45);
  --borda:rgba(255,255,255,.10);      /* linhas finas sobre fundo escuro */
  --sombra:0 18px 50px rgba(0,0,0,.35);
  --suaveNoClaro:rgba(14,26,21,.66);   /* texto secundario dentro da secao clara */
  --linhaNoClaro:rgba(14,26,21,.30);   /* linha pontilhada do cardapio */
  --riscoNoClaro:rgba(14,26,21,.16);   /* risco do cabecalho na secao clara */
  --hoverNoClaro:rgba(14,26,21,.06);   /* hover das linhas do cardapio */
  --acentoNoClaro:#8A4F26;             /* acento aprovado no contraste sobre a secao clara */
  --larguraMax:1200px;
}

/* =========================================================================
   RESET E BASE
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font-family:var(--fonteTexto); font-weight:400; line-height:1.65;
  font-size:16px; overflow-x:hidden;
}
body.travado{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{font-family:var(--fonteTitulo);font-weight:700;line-height:1.12;margin:0}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:2px}
::selection{background:var(--acento);color:var(--contraste)}

.env{width:100%;max-width:var(--larguraMax);margin:0 auto;padding:0 20px}
.secao{padding:clamp(64px,9vw,116px) 0;position:relative}
.secao-clara{background:var(--claro);color:var(--fundo)}
.secao-alt{background:var(--fundoAlt)}
.oculto{display:none !important}
.visual-oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================================
   CABECALHO DE SECAO (etiqueta + titulo + linha) - padrao repetido em tudo
   ========================================================================= */
.cab{margin-bottom:clamp(32px,5vw,56px)}
.cab .etiqueta{
  display:flex;align-items:center;gap:9px;
  font-family:var(--fonteTexto);font-size:11px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;color:var(--acento);margin-bottom:14px;
}
.cab .etiqueta::before{
  content:"";width:7px;height:7px;background:var(--acento);
  transform:rotate(45deg);flex:none;
}
.cab .linha-titulo{display:flex;align-items:center;gap:22px}
.cab h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.01em;flex:none;max-width:74%}
.cab .risco{height:1px;background:var(--borda);flex:1}
.secao-clara .cab .risco{background:var(--riscoNoClaro)}
.cab .sub{margin-top:14px;color:var(--textoSuave);max-width:62ch}
.secao-clara .cab .sub{color:var(--suaveNoClaro)}

/* =========================================================================
   BOTOES
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 28px;border-radius:var(--raio);
  font-family:var(--fonteTexto);font-size:14px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  transition:background .28s ease,color .28s ease,border-color .28s ease,transform .28s ease;
}
.btn-primario{background:var(--acento);color:var(--contraste)}
.btn-primario:hover{background:var(--acentoEscuro)}
.btn-secundario{border:1px solid currentColor;color:var(--texto)}
.btn-secundario:hover{background:var(--texto);color:var(--fundo)}
.secao-clara .btn-secundario{color:var(--fundo)}
.secao-clara .btn-secundario:hover{background:var(--fundo);color:var(--claro)}
.btn-texto{
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--textoSuave);
  padding:12px 4px;min-height:44px;transition:color .28s ease;
}
.btn-texto:hover{color:var(--acento)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* =========================================================================
   HEADER FIXO
   ========================================================================= */
.topo{
  position:fixed;inset:0 0 auto 0;z-index:900;
  transition:background .35s ease,box-shadow .35s ease,padding .35s ease;
  padding:20px 0;
}
.topo.solido{background:var(--fundo);box-shadow:0 1px 0 var(--borda),0 10px 30px rgba(0,0,0,.28);padding:12px 0}
.topo .env{display:flex;align-items:center;justify-content:space-between;gap:20px}
.marca{font-family:var(--fonteTitulo);font-size:20px;letter-spacing:.02em;line-height:1;color:var(--texto)}
.marca span{color:var(--acento)}
.nav-desk{display:flex;align-items:center;gap:30px}
.nav-desk a{
  font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texto);opacity:.82;transition:opacity .25s ease,color .25s ease;
}
.nav-desk a:hover{opacity:1;color:var(--acento)}
.hamburguer{display:none;width:48px;height:48px;align-items:center;justify-content:center}
.hamburguer i{display:block;width:24px;height:2px;background:var(--texto);position:relative}
.hamburguer i::before,.hamburguer i::after{content:"";position:absolute;left:0;width:24px;height:2px;background:var(--texto)}
.hamburguer i::before{top:-7px}.hamburguer i::after{top:7px}
.menu-cheio{
  position:fixed;inset:0;z-index:950;background:var(--fundo);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;
}
.menu-cheio.aberto{opacity:1;visibility:visible}
.menu-cheio a{font-family:var(--fonteTitulo);font-size:28px;padding:12px 20px;color:var(--texto)}
.menu-cheio a:hover{color:var(--acento)}
.fechar-menu{position:absolute;top:18px;right:14px;width:52px;height:52px;font-size:30px;line-height:1;color:var(--texto)}

/* =========================================================================
   HERO
   ========================================================================= */
.hero{
  min-height:100svh;display:flex;align-items:flex-end;
  position:relative;overflow:hidden;padding-bottom:clamp(56px,9vh,96px);
}
.hero-fundo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.hero-fundo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--overlay) 12%,var(--overlaySuave) 55%,var(--overlay) 100%);
}
.hero .env{position:relative;z-index:1}
.hero .lugar{
  display:flex;align-items:center;gap:9px;color:var(--acento);
  font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;
}
.hero .lugar::before{content:"";width:7px;height:7px;background:var(--acento);transform:rotate(45deg)}
.hero h1{font-size:clamp(46px,12vw,104px);letter-spacing:-.02em;margin-bottom:20px}
.hero h1 .l1{display:block;color:var(--acento)}
.hero h1 .l2{display:block;color:var(--texto)}
.hero .frase{font-size:clamp(17px,2.4vw,21px);color:var(--texto);max-width:34ch;margin-bottom:34px;opacity:.92}
.hero .acoes{display:flex;flex-wrap:wrap;gap:14px}
.hero .rolar{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:1px;height:52px;background:linear-gradient(to bottom,transparent,var(--acento));z-index:1;
}

/* =========================================================================
   BARRA DE CONTATO
   ========================================================================= */
.barra-contato{background:var(--fundoAlt);padding:0}
.barra-contato .env{display:grid;grid-template-columns:repeat(3,1fr)}
.barra-contato a{
  display:flex;align-items:center;gap:14px;padding:26px 18px;min-height:44px;
  border-right:1px solid var(--borda);transition:background .3s ease;
}
.barra-contato a:first-child{padding-left:0}
.barra-contato a:last-child{border-right:0}
.barra-contato a:hover{background:rgba(255,255,255,.03)}
.barra-contato svg{width:22px;height:22px;flex:none;fill:var(--acento)}
.barra-contato .rot{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--textoSuave)}
.barra-contato .val{display:block;font-size:15px;font-weight:500;line-height:1.4}

/* =========================================================================
   BLOCO SOCIAL
   ========================================================================= */
.social{background:var(--fundo);display:flex;align-items:stretch}
.social .caixa{
  width:35%;min-width:230px;background:var(--acento);
  display:flex;align-items:center;gap:22px;padding:22px 26px;
}
.social .caixa a{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.social .caixa svg{width:24px;height:24px;fill:var(--contraste);transition:transform .3s ease}
.social .caixa a:hover svg{transform:scale(1.14)}
.social .resto{flex:1;display:flex;align-items:center;padding:0 26px;color:var(--textoSuave);font-size:14px}

/* =========================================================================
   SOBRE
   ========================================================================= */
.sobre-texto{max-width:66ch;font-size:clamp(16px,2vw,18px)}
.sobre-texto strong{color:var(--acento);font-weight:600}
.faixa-fotos{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(36px,6vw,64px)}
.faixa-fotos img{
  width:100%;height:clamp(180px,26vw,340px);object-fit:cover;
  filter:grayscale(1);transition:filter .5s ease;
}
.faixa-fotos img:hover{filter:grayscale(0)}

/* =========================================================================
   NUMEROS (so renderiza se CONFIG.numeros tiver itens)
   ========================================================================= */
.numeros-grade{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,60px);align-items:center}
.numeros-grade img{width:100%;height:100%;min-height:280px;object-fit:cover;border-radius:var(--raio)}
.contadores{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.contador .n{font-family:var(--fonteTitulo);font-size:clamp(38px,6vw,58px);color:var(--acento);line-height:1}
.contador .r{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--textoSuave);margin-top:6px}

/* =========================================================================
   MARCAS (carrossel infinito em CSS puro)
   ========================================================================= */
.esteira{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.esteira-trilho{display:flex;gap:60px;width:max-content;animation:correr 26s linear infinite}
.esteira:hover .esteira-trilho{animation-play-state:paused}
.esteira img{height:38px;width:auto;filter:grayscale(1) brightness(1.8);opacity:.5;transition:opacity .3s ease,filter .3s ease}
.esteira img:hover{opacity:1;filter:none}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* =========================================================================
   SERVICOS - cardapio impresso sobre fundo claro
   ========================================================================= */
.onda{display:block;width:100%;height:clamp(40px,6vw,80px);fill:var(--claro)}
.onda-fim{transform:rotate(180deg)}
.servicos{padding-top:clamp(16px,3vw,34px);padding-bottom:clamp(16px,3vw,34px)}
.cardapio{max-width:820px;margin:0 auto}
.categoria{margin-bottom:clamp(38px,6vw,58px)}
.categoria-titulo{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.categoria-titulo h3{font-size:clamp(20px,3.4vw,27px);flex:none;color:var(--fundo)}
.categoria-titulo .hachura{
  flex:1;height:12px;
  background:repeating-linear-gradient(45deg,var(--acento) 0 1px,transparent 1px 7px);
  opacity:.55;
}
.item-servico{
  display:flex;align-items:flex-end;gap:12px;width:100%;text-align:left;
  padding:14px 8px;min-height:56px;border-radius:var(--raio);
  transition:background .28s ease;
}
.item-servico:hover{background:var(--hoverNoClaro)}
.item-servico .nome{font-size:17px;font-weight:600;color:var(--fundo);flex:none;line-height:1.3}
.item-servico .desc{display:block;font-size:13px;font-weight:400;color:var(--suaveNoClaro);margin-top:3px}
.item-servico .dur{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--acentoNoClaro);margin-top:5px}
.item-servico .pontos{flex:1;border-bottom:1px dashed var(--linhaNoClaro);transform:translateY(-6px);min-width:24px}
.item-servico .preco{font-family:var(--fonteTitulo);font-size:20px;color:var(--acentoNoClaro);flex:none;white-space:nowrap}
.aviso-cardapio{text-align:center;color:var(--suaveNoClaro);font-size:14px;margin-top:8px}

/* =========================================================================
   EQUIPE
   ========================================================================= */
.grade-equipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
.card-barbeiro{background:var(--fundoAlt);border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;display:flex;flex-direction:column}
.card-barbeiro img{width:100%;height:290px;object-fit:cover;filter:grayscale(.55);transition:filter .45s ease}
.card-barbeiro:hover img{filter:grayscale(0)}
.card-barbeiro .corpo{padding:22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-barbeiro h3{font-size:21px}
.card-barbeiro .esp{color:var(--acento);font-size:13px;letter-spacing:1.4px;text-transform:uppercase}
.card-barbeiro .dias{color:var(--textoSuave);font-size:14px;margin-bottom:14px}
.card-barbeiro .btn{margin-top:auto;width:100%}

/* =========================================================================
   GALERIA
   ========================================================================= */
.filtros{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.filtro{
  min-height:44px;padding:0 20px;border:1px solid var(--borda);border-radius:var(--raio);
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--textoSuave);
  transition:all .28s ease;
}
.filtro:hover{color:var(--texto);border-color:var(--texto)}
.filtro.ativo{background:var(--acento);border-color:var(--acento);color:var(--contraste)}
.grade-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.foto-galeria{position:relative;overflow:hidden;border-radius:var(--raio);padding:0;display:block}
.foto-galeria img{width:100%;height:250px;object-fit:cover;transition:transform .55s ease}
.foto-galeria:hover img{transform:scale(1.05)}
.foto-galeria .leg{
  position:absolute;inset:auto 0 0 0;padding:26px 16px 14px;text-align:left;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent);
  color:#fff;font-size:14px;opacity:0;transition:opacity .35s ease;
}
.foto-galeria:hover .leg,.foto-galeria:focus-visible .leg{opacity:1}
.lightbox{
  position:fixed;inset:0;z-index:980;background:rgba(0,0,0,.93);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;
}
.lightbox.aberto{opacity:1;visibility:visible}
.lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:var(--raio)}
.lightbox .leg-grande{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.lightbox .fechar{position:absolute;top:14px;right:14px;width:52px;height:52px;font-size:32px;color:#fff}

/* =========================================================================
   PEDIDO DE HORARIO
   ========================================================================= */
.caixa-pedido{
  max-width:760px;margin:0 auto;background:var(--fundoAlt);
  border:1px solid var(--borda);border-radius:var(--raio);
  padding:clamp(22px,4vw,40px);box-shadow:var(--sombra);
}
.progresso{display:flex;gap:6px;margin-bottom:8px}
.progresso i{flex:1;height:3px;background:var(--borda);border-radius:2px;transition:background .35s ease}
.progresso i.feito{background:var(--acento)}
.passo-rotulo{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--textoSuave);margin:14px 0 4px}
.passo-titulo{font-size:clamp(21px,3.4vw,28px);margin-bottom:22px}
.opcoes{display:grid;gap:10px}
.opcao{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  min-height:60px;padding:14px 18px;border:1px solid var(--borda);
  border-radius:var(--raio);background:rgba(255,255,255,.02);
  transition:border-color .25s ease,background .25s ease;
}
.opcao:hover{border-color:var(--acento);background:rgba(255,255,255,.05)}
.opcao .info{flex:1;min-width:0}
.opcao .t{display:block;font-weight:600;font-size:16px}
.opcao .s{display:block;font-size:13px;color:var(--textoSuave);margin-top:2px}
.opcao .v{font-family:var(--fonteTitulo);font-size:18px;color:var(--acento);white-space:nowrap}
.opcao img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.opcao .inicial{
  width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--acento);color:var(--contraste);font-family:var(--fonteTitulo);font-size:20px;
}
.grupo-opcoes{margin-bottom:20px}
.grupo-opcoes h4{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--acento);margin-bottom:10px}
.grade-dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.dia{
  min-height:76px;padding:12px 8px;border:1px solid var(--borda);border-radius:var(--raio);
  text-align:center;transition:border-color .25s ease,background .25s ease;
}
.dia:hover{border-color:var(--acento);background:rgba(255,255,255,.05)}
.dia .ds{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--textoSuave)}
.dia .dn{display:block;font-family:var(--fonteTitulo);font-size:24px;margin:2px 0}
.dia .dm{display:block;font-size:12px;color:var(--textoSuave)}
.grade-horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.hora{
  min-height:52px;border:1px solid var(--borda);border-radius:var(--raio);
  font-size:16px;font-weight:600;transition:all .25s ease;
}
.hora:hover{border-color:var(--acento);background:var(--acento);color:var(--contraste)}
.campo-nome{
  width:100%;min-height:56px;padding:0 18px;font-size:17px;
  background:rgba(255,255,255,.03);color:var(--texto);
  border:1px solid var(--borda);border-radius:var(--raio);
}
.campo-nome::placeholder{color:var(--textoSuave)}
.campo-nome:focus{outline:2px solid var(--acento);outline-offset:2px;border-color:transparent}
.dica{font-size:13px;color:var(--textoSuave);margin-top:12px}
.resumo{border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;margin-bottom:22px}
.linha-resumo{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--borda)}
.linha-resumo:last-child{border-bottom:0}
.linha-resumo .rl{width:88px;flex:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--textoSuave)}
.linha-resumo .rv{flex:1;font-weight:600}
.rodape-passo{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}
.acoes-finais{display:grid;gap:12px}
.acoes-finais .btn{width:100%}
.sucesso{text-align:center;padding:14px 0}
.sucesso .selo{
  width:74px;height:74px;margin:0 auto 22px;border-radius:50%;
  border:2px solid var(--acento);display:flex;align-items:center;justify-content:center;
}
.sucesso .selo svg{width:34px;height:34px;fill:var(--acento)}
.sucesso h3{font-size:clamp(22px,4vw,30px);margin-bottom:12px}
.sucesso p{color:var(--textoSuave);max-width:46ch;margin:0 auto 10px}
.copiado{color:var(--acento);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;min-height:20px;text-align:center;margin-top:10px}

/* =========================================================================
   DEPOIMENTOS (so renderiza se houver itens reais)
   ========================================================================= */
.grade-depo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.card-depo{border:1px solid var(--borda);border-radius:var(--raio);padding:26px;background:var(--fundoAlt)}
.card-depo .quem{color:var(--acento);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-top:14px}

/* =========================================================================
   FAQ
   ========================================================================= */
.faq{max-width:820px;margin:0 auto}
.item-faq{border-bottom:1px solid var(--borda)}
.pergunta{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  width:100%;text-align:left;padding:22px 4px;min-height:44px;
  font-size:clamp(16px,2.3vw,18px);font-weight:600;transition:color .25s ease;
}
.pergunta:hover{color:var(--acento)}
.pergunta .mais{flex:none;width:22px;height:22px;position:relative}
.pergunta .mais::before,.pergunta .mais::after{
  content:"";position:absolute;left:50%;top:50%;background:var(--acento);
  transform:translate(-50%,-50%);transition:transform .3s ease;
}
.pergunta .mais::before{width:16px;height:2px}
.pergunta .mais::after{width:2px;height:16px}
.pergunta[aria-expanded="true"] .mais::after{transform:translate(-50%,-50%) rotate(90deg)}
.resposta{overflow:hidden;max-height:0;transition:max-height .4s ease}
.resposta div{padding:0 4px 22px;color:var(--textoSuave);max-width:70ch}

/* =========================================================================
   LOCALIZACAO
   ========================================================================= */
.grade-local{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,56px)}
.contato-linha{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--borda)}
.contato-linha svg{width:22px;height:22px;fill:var(--acento);flex:none;margin-top:3px}
.contato-linha .rot{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--textoSuave)}
.contato-linha .val{font-size:16px;line-height:1.5}
.card-horarios{background:var(--fundoAlt);border:1px solid var(--borda);border-radius:calc(var(--raio) * 3);padding:26px}
.card-horarios h3{font-size:19px;margin-bottom:16px}
.linha-hora{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--borda);font-size:15px}
.linha-hora:last-child{border-bottom:0}
.linha-hora .d{font-weight:600}
.linha-hora .h{color:var(--acento)}
.linha-hora.fechado .h{color:var(--textoSuave)}
.linha-hora.hoje{background:rgba(255,255,255,.03);margin:0 -12px;padding:12px;border-radius:var(--raio)}
.mapa{width:100%;height:400px;border:0;border-radius:calc(var(--raio) * 3);margin-top:clamp(28px,5vw,48px);filter:grayscale(.35) contrast(1.05)}

/* =========================================================================
   RODAPE
   ========================================================================= */
.curva{display:block;width:100%;height:60px;fill:var(--fundoAlt)}
.rodape{background:var(--fundoAlt);padding:0 0 40px;text-align:center}
.rodape .marca{font-size:26px;display:inline-block;margin-bottom:18px}
.rodape .redes{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.rodape .redes a{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--borda);border-radius:50%}
.rodape .redes svg{width:19px;height:19px;fill:var(--texto);transition:fill .3s ease}
.rodape .redes a:hover svg{fill:var(--acento)}
.rodape .mini{color:var(--textoSuave);font-size:13px;line-height:1.9}
.rodape .mini a{color:var(--acento)}

/* =========================================================================
   BOTAO FLUTUANTE DE WHATSAPP
   ========================================================================= */
.zap-flutua{
  position:fixed;right:18px;bottom:18px;z-index:970;
  width:60px;height:60px;border-radius:50%;background:var(--zap);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.zap-flutua svg{width:31px;height:31px;fill:#fff}
.zap-flutua::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--zap);animation:pulsar 2.6s ease-out infinite;
}
@keyframes pulsar{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}

/* =========================================================================
   ENTRADA DAS SECOES
   ========================================================================= */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.reveal.dentro{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
  .reveal{opacity:1;transform:none}
}

/* =========================================================================
   RESPONSIVO
   ========================================================================= */
@media (max-width:1024px){

/* =========================================================================================
   TEMA — injeta as chaves do tema como variáveis CSS no :root
   ========================================================================================= */
const TEMA = Object.assign({}, TEMAS[CONFIG.tema] || TEMAS['ouro-noturno'], CONFIG.temaCustom || {});

function hexRgba(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* Contraste relativo entre duas cores (WCAG). Usado para garantir 4.5:1 no acento
   quando ele aparece sobre a secao clara, em qualquer um dos temas. */
function paraRgb(hex){
  const h = hex.replace('#','');
  const c = h.length === 3 ? h.split('').map(x=>x+x).join('') : h;
  return [0,2,4].map(i => parseInt(c.substr(i,2),16));
}
function luminancia(hex){
  const [r,g,b] = paraRgb(hex).map(v => {
    const x = v/255;
    return x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function contraste(a, b){
  const l1 = luminancia(a), l2 = luminancia(b);
  return (Math.max(l1,l2) + 0.05) / (Math.min(l1,l2) + 0.05);
}
function misturar(a, b, p){
  const A = paraRgb(a), B = paraRgb(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*p).toString(16).padStart(2,'0')).join('');
}
/* Escurece (ou clareia, no tema claro) o acento ate atingir o contraste minimo sobre o fundo dado */
function acentoLegivel(acento, fundoDaSecao, direcao, minimo){
  let cor = acento, p = 0;
  while (contraste(cor, fundoDaSecao) < minimo && p < 0.95){
    p += 0.05;
    cor = misturar(acento, direcao, p);
  }
  return cor;
}

function aplicarTema(){
  const r = document.documentElement.style;
  ['fundo','fundoAlt','acento','acentoEscuro','claro','texto','textoSuave','contraste','zap','raio']
    .forEach(k => r.setProperty('--' + k, TEMA[k]));
  r.setProperty('--fonteTitulo', TEMA.fonteTitulo);
  r.setProperty('--fonteTexto', TEMA.fonteTexto);

  // O overlay das fotos e a cor das linhas finas saem do tema, para o tema claro funcionar igual
  const claroPorBaixo = TEMA.tomImagem === 'claro';
  r.setProperty('--overlay',      hexRgba(TEMA.fundo, claroPorBaixo ? .58 : .78));
  r.setProperty('--overlaySuave', hexRgba(TEMA.fundo, claroPorBaixo ? .30 : .42));
  r.setProperty('--borda',        claroPorBaixo ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.10)');
  r.setProperty('--sombra',       claroPorBaixo ? '0 18px 50px rgba(0,0,0,.10)' : '0 18px 50px rgba(0,0,0,.35)');

  // Dentro da secao clara o texto e a cor --fundo, entao os tons de apoio saem dela
  r.setProperty('--suaveNoClaro', hexRgba(TEMA.fundo, .66));
  r.setProperty('--linhaNoClaro', hexRgba(TEMA.fundo, .30));
  r.setProperty('--riscoNoClaro', hexRgba(TEMA.fundo, .16));
  r.setProperty('--hoverNoClaro', hexRgba(TEMA.fundo, .06));
  // O acento so entra na secao clara depois de passar no teste de 4.5:1
  r.setProperty('--acentoNoClaro', acentoLegivel(TEMA.acentoEscuro, TEMA.claro, TEMA.fundo, 4.5));

  const metaCor = document.querySelector('meta[name="theme-color"]');
  if (metaCor) metaCor.setAttribute('content', TEMA.fundo);

  // Google Fonts injetado a partir da string googleFonts do tema
  const familias = TEMA.googleFonts.split('|').map(f => 'family=' + f).join('&');
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?' + familias + '&display=swap';
  document.head.appendChild(link);
}
aplicarTema();

  function capa(nome, linha2){

  return { salao, fachada, cadeira, bancada, retrato, corte, capa };

/* =========================================================================================
   SEO — title, description, Open Graph, favicon e JSON-LD, tudo gerado do CONFIG
   ========================================================================================= */
function montarSeo(){
  const titulo = CONFIG.nome + ' — Barbearia na ' + CONFIG.bairro + ', ' + CONFIG.cidade;
  const desc = 'Barbearia no ' + CONFIG.bairro + ' desde ' + CONFIG.fundacao +
    '. Corte, barba e barboterapia com hora marcada. Peça seu horário pelo site e confirme no WhatsApp.';
  document.title = titulo;

  const meta = (attr, chave, valor) => {
    const m = document.createElement('meta');
    m.setAttribute(attr, chave); m.setAttribute('content', valor);
    document.head.appendChild(m);
  };
  meta('name','description', desc);
  meta('name','keywords', 'barbearia ' + CONFIG.bairro + ', barbearia ' + CONFIG.cidade + ', corte masculino, barba');
  meta('property','og:type','website');
  meta('property','og:title', titulo);
  meta('property','og:description', desc);
  meta('property','og:locale','pt_BR');
  meta('property','og:site_name', CONFIG.nome);
  meta('property','og:image', CONFIG.fotoHero || ILUSTRA.capa(CONFIG.nome, CONFIG.bairro + ' · ' + CONFIG.cidade + ' · desde ' + CONFIG.fundacao));
  meta('name','twitter:card','summary_large_image');
  meta('name','twitter:title', titulo);
  meta('name','twitter:description', desc);

  // Favicon: tesoura simplificada em SVG, na cor do acento
  const fav = document.createElement('link');
  fav.rel = 'icon';
  fav.href = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
    '<rect width="32" height="32" rx="6" fill="'+TEMA.fundo+'"/>' +
    '<text x="16" y="22" font-family="Georgia,serif" font-size="17" fill="'+TEMA.acento+'" text-anchor="middle">' +
    CONFIG.nome.trim().charAt(0) + '</text></svg>');
  document.head.appendChild(fav);

  // JSON-LD HairSalon
  const aberturas = DIAS_CHAVE.map((k, i) => {
    const h = CONFIG.horarios[k];
    if (!h || h.fechado) return null;
    return {
      '@type':'OpeningHoursSpecification',
      dayOfWeek: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i],
      opens: h.abre, closes: h.fecha
    };
  }).filter(Boolean);

  const salao = {
    '@context':'https://schema.org', '@type':'HairSalon',
    name: CONFIG.nome, description: desc,
    address:{ '@type':'PostalAddress', streetAddress: CONFIG.enderecoCurto,
      addressLocality: CONFIG.cidade, addressRegion: CONFIG.uf,
      postalCode: CONFIG.cep, addressCountry:'BR' },
    geo:{ '@type':'GeoCoordinates', latitude: CONFIG.lat, longitude: CONFIG.lng },
    telephone:'+' + CONFIG.whatsapp,
    priceRange: CONFIG.faixaPreco,
    openingHoursSpecification: aberturas,
    hasMap: CONFIG.linkMaps,
    sameAs: [CONFIG.instagramUrl, CONFIG.facebookUrl].filter(Boolean),
    makesOffer: CONFIG.servicos.flatMap(g => g.itens.map(s => ({
      '@type':'Offer', name: s.nome,
      priceSpecification:{ '@type':'PriceSpecification', price: s.preco, priceCurrency:'BRL' }
    })))
  };

  const faqLd = {
    '@context':'https://schema.org','@type':'FAQPage',
    mainEntity: CONFIG.faq.map(f => ({
      '@type':'Question', name: f.p,
      acceptedAnswer:{ '@type':'Answer', text: f.r }
    }))
  };

  [salao, ligado('faq') && CONFIG.faq.length ? faqLd : null].filter(Boolean).forEach(obj => {
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(obj);
    document.head.appendChild(s);
  });
}
montarSeo();

const diasPorExtenso = dias => {
  const idx = dias.map(d => DIAS_CHAVE.indexOf(d)).sort((a,b) => a-b);
  const seguido = idx.every((v,i) => i === 0 || v === idx[i-1] + 1);
  if (seguido && idx.length > 1) return DIAS_LONGOS[idx[0]].replace('-feira','') + ' a ' + DIAS_LONGOS[idx[idx.length-1]].replace('-feira','');
  return idx.map(i => DIAS_CURTOS[i]).join(' · ');
};

  $$('#galeria-conteudo .foto-galeria').forEach(ft => ft.addEventListener('click', () => {

    document.body.classList.remove('travado');

  }
  $('#fechar-lightbox').addEventListener('click', fechar);
  caixa.addEventListener('click', e => { if (e.target === caixa) fechar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && caixa.classList.contains('aberto')) fechar(); });

/* =========================================================================================
   PEDIDO DE HORÁRIO
   O estado vive só em memória. Recarregou a página, começa de novo — e tudo bem.
   Nada é salvo em localStorage, sessionStorage, cookie ou servidor.
   ========================================================================================= */
const TOTAL_PASSOS = 6;
let passo = 1;
let pedido = { servico:null, barbeiro:null, data:null, minutos:null, nome:'' };

const palco = () => $('#pedido-palco');

function topoPasso(n, titulo){
  return '<p class="passo-rotulo">Passo ' + n + ' de ' + TOTAL_PASSOS + '</p>' +
         '<h3 class="passo-titulo">' + titulo + '</h3>';

function rodapePasso(voltarPara, extra){
  return '<div class="rodape-passo">' +
    (voltarPara ? '<button class="btn-texto" data-voltar="' + voltarPara + '">← Voltar</button>' : '<span></span>') +
    (extra || '<span></span>') + '</div>';
}

/* --- disponibilidade ------------------------------------------------------------------- */
function horariosDoDia(data){
  const chave = DIAS_CHAVE[data.getDay()];
  const h = CONFIG.horarios[chave];
  if (!h || h.fechado) return [];
  const dur = pedido.servico ? pedido.servico.duracao : CONFIG.intervaloGrade;
  const abre = hmParaMin(h.abre), fecha = hmParaMin(h.fecha);
  const agora = new Date();
  const ehHoje = data.toDateString() === agora.toDateString();
  const limiteHoje = agora.getHours() * 60 + agora.getMinutes() + 15; // 15 min de folga
  const lista = [];
  for (let t = abre; t + dur <= fecha; t += CONFIG.intervaloGrade){
    if (ehHoje && t < limiteHoje) continue;
    lista.push(t);
  }
  return lista;
}

function barbeiroAtende(b, chaveDia){ return b.dias.indexOf(chaveDia) !== -1; }

function diasDisponiveis(){
  const dias = [];
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  for (let i = 0; i < 14; i++){
    const d = new Date(hoje); d.setDate(hoje.getDate() + i);
    const chave = DIAS_CHAVE[d.getDay()];
    const h = CONFIG.horarios[chave];
    if (!h || h.fechado) continue;                                   // barbearia fechada
    if (pedido.barbeiro){
      if (!barbeiroAtende(pedido.barbeiro, chave)) continue;          // barbeiro não atende nesse dia
    } else if (!CONFIG.barbeiros.some(b => barbeiroAtende(b, chave))) continue;
    if (!horariosDoDia(d).length) continue;                           // dia sem horário sobrando
    dias.push(d);
  }
  return dias;
}

  palco().innerHTML = topoPasso(3, 'Que dia fica bom?') + grade +

    (pedido.barbeiro ? ' e sem os dias em que ' + escapar(pedido.barbeiro.nome.split(' ')[0]) + ' não atende' : '') + '.</p>' +

  const campo = $('#campo-nome'), botao = $('#ir-revisao');
  const validar = () => { botao.disabled = campo.value.trim().length < 2; };
  campo.addEventListener('input', () => { pedido.nome = campo.value; validar(); });
  campo.addEventListener('keydown', e => { if (e.key === 'Enter' && !botao.disabled) botao.click(); });
  botao.addEventListener('click', () => irPara(6));
  validar();

  return DIAS_LONGOS[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

function montarMensagem(){
  const s = pedido.servico;
  return 'Olá! Vim pelo site e queria pedir um horário.\n\n' +
    'Serviço: ' + s.nome + ' (' + reais(s.preco) + ' — ' + minutos(s.duracao) + ')\n' +
    'Barbeiro: ' + (pedido.barbeiro ? pedido.barbeiro.nome : 'Tanto faz') + '\n' +
    'Dia: ' + textoData(pedido.data) + '\n' +

    'Nome: ' + pedido.nome.trim() + '\n\n' +

}

function telaRevisao(){
  const s = pedido.servico;
  const linha = (rot, val, ir) =>
    '<div class="linha-resumo"><span class="rl">' + rot + '</span><span class="rv">' + escapar(val) + '</span>' +
    '<button class="btn-texto" data-voltar="' + ir + '">Trocar</button></div>';
  palco().innerHTML = topoPasso(6, 'Confere se está certo') +
    '<div class="resumo">' +
      linha('Serviço', s.nome + ' — ' + reais(s.preco) + ' · ' + minutos(s.duracao), 1) +
      linha('Barbeiro', pedido.barbeiro ? pedido.barbeiro.nome : 'Tanto faz', 2) +
      linha('Dia', textoData(pedido.data), 3) +
      linha('Horário', minParaHm(pedido.minutos), 4) +
      linha('Nome', pedido.nome.trim(), 5) +
    '</div>' +
    '<div class="acoes-finais">' +
      '<button class="btn btn-primario" id="enviar-zap">Enviar pedido pelo WhatsApp</button>' +
      '<button class="btn btn-secundario" id="copiar-msg">Copiar mensagem</button>' +
    '</div><p class="copiado" id="aviso-copia" role="status"></p>' +
    '<p class="dica">O site envia o pedido; ele não confirma o horário sozinho. A barbearia responde no WhatsApp confirmando.</p>' +
    rodapePasso(5);

  $('#enviar-zap').addEventListener('click', () => {
    window.open(linkZap(montarMensagem()), '_blank', 'noopener');
    telaSucesso();
  });
  $('#copiar-msg').addEventListener('click', copiarMensagem);
}

function copiarMensagem(){
  const texto = montarMensagem();
  const aviso = $('#aviso-copia');
  const ok = () => { if (aviso) aviso.textContent = 'Mensagem copiada'; setTimeout(() => { if (aviso) aviso.textContent = ''; }, 2600); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok).catch(copiaAntiga);
  } else copiaAntiga();
  function copiaAntiga(){
    const t = document.createElement('textarea');
    t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch(e){ if (aviso) aviso.textContent = 'Não consegui copiar aqui'; }
    document.body.removeChild(t);
  }
}

function telaSucesso(){
  passo = TOTAL_PASSOS; pintarProgresso();
  palco().innerHTML =
    '<div class="sucesso"><div class="selo">' + ICONE.check + '</div>' +
    '<h3>Pedido enviado</h3>' +
    '<p>Abrimos o WhatsApp com o seu pedido. Se a conversa não abriu, copie a mensagem e mande para a gente.</p>' +
    '<p>Esse horário ainda não está confirmado: a barbearia responde pelo WhatsApp assinalando se está de pé.</p>' +
    '<div class="acoes-finais" style="max-width:340px;margin:22px auto 0">' +
      '<button class="btn btn-secundario" id="copiar-msg2">Copiar mensagem</button>' +
      '<button class="btn-texto" id="recomecar">Pedir outro horário</button>' +
    '</div><p class="copiado" id="aviso-copia" role="status"></p></div>';
  $('#copiar-msg2').addEventListener('click', copiarMensagem);
  $('#recomecar').addEventListener('click', () => {
    pedido = { servico:null, barbeiro:null, data:null, minutos:null, nome:'' };
    irPara(1);
  });
}

/* --- navegação do fluxo ------------------------------------------------------------------ */
function irPara(n, rolar){
  passo = n;
  pintarProgresso();
  if (n === 1) telaServico();
  else if (n === 2) telaBarbeiro();
  else if (n === 3) telaDia();
  else if (n === 4) telaHora();
  else if (n === 5) telaNome();
  else telaRevisao();
  ligarCliquesDoPasso();
  if (rolar) $('#pedido').scrollIntoView({ behavior: prefereMenosMovimento() ? 'auto' : 'smooth', block:'start' });
}

function prefereMenosMovimento(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function ligarCliquesDoPasso(){
  $$('#pedido-palco [data-servico]').forEach(b => b.addEventListener('click', () => {
    const [gi, si] = b.dataset.servico.split('-').map(Number);
    escolherServico(CONFIG.servicos[gi].itens[si], false);
  }));
  $$('#pedido-palco [data-barbeiro]').forEach(b => b.addEventListener('click', () => {
    pedido.barbeiro = b.dataset.barbeiro === 'qualquer' ? null : CONFIG.barbeiros[+b.dataset.barbeiro];
    pedido.data = null; pedido.minutos = null;
    irPara(3);
  }));
  $$('#pedido-palco [data-dia]').forEach(b => b.addEventListener('click', () => {
    pedido.data = janelaDias[+b.dataset.dia];
    pedido.minutos = null;
    irPara(4);
  }));
  $$('#pedido-palco [data-hora]').forEach(b => b.addEventListener('click', () => {
    pedido.minutos = +b.dataset.hora;
    irPara(5);
  }));
  $$('#pedido-palco [data-voltar]').forEach(b => b.addEventListener('click', () => irPara(+b.dataset.voltar)));
}

function escolherServico(servico, rolar){
  pedido.servico = servico;
  pedido.minutos = null;                       // duração mudou, a grade precisa ser refeita
  irPara(pedido.barbeiro ? 3 : 2, rolar);
}

function escolherBarbeiroDireto(b){
  pedido.barbeiro = b;
  pedido.data = null; pedido.minutos = null;
  irPara(pedido.servico ? 3 : 1, true);
}

/* =========================================================================================
   INTERAÇÕES GERAIS — header, menu, entrada das seções e contadores
   ========================================================================================= */
function ligarHeader(){
  const topo = $('#topo');
  const marcar = () => topo.classList.toggle('solido', window.scrollY > 100);
  marcar();
  window.addEventListener('scroll', marcar, { passive:true });

  const menu = $('#menu-cheio'), abrir = $('#abrir-menu'), fechar = $('#fechar-menu');
  const abrirMenu = () => {
    menu.classList.add('aberto'); document.body.classList.add('travado');
    abrir.setAttribute('aria-expanded','true'); fechar.focus();
  };
  const fecharMenu = () => {
    menu.classList.remove('aberto'); document.body.classList.remove('travado');
    abrir.setAttribute('aria-expanded','false'); abrir.focus();
  };
  abrir.addEventListener('click', abrirMenu);
  fechar.addEventListener('click', fecharMenu);
  $$('#menu-cheio a').forEach(a => a.addEventListener('click', fecharMenu));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('aberto')) fecharMenu(); });
}

function ligarEntradas(){
  if (prefereMenosMovimento() || !('IntersectionObserver' in window)){
    $$('.reveal').forEach(e => e.classList.add('dentro'));
    return;
  }
  const obs = new IntersectionObserver((itens, self) => {
    itens.forEach(i => {
      if (i.isIntersecting){ i.target.classList.add('dentro'); self.unobserve(i.target); }
    });
  }, { threshold:0.12, rootMargin:'0px 0px -60px 0px' });
  $$('.reveal').forEach(e => obs.observe(e));
}

function ligarContadores(){
  const alvos = $$('#numeros .n');
  if (!alvos.length || !('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver((itens, self) => {
    itens.forEach(i => {
      if (!i.isIntersecting) return;
      self.unobserve(i.target);
      const fim = +i.target.dataset.alvo, inicio = performance.now(), dur = 2000;
      const passoAnim = agora => {
        const p = Math.min((agora - inicio) / dur, 1);
        i.target.textContent = Math.round(fim * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(passoAnim);
      };
      requestAnimationFrame(passoAnim);
    });
  }, { threshold:0.4 });
  alvos.forEach(a => obs.observe(a));
}
